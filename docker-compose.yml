services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - app-data:/data
    environment:
      - DB_PATH=/data/komiku-cloud.db
      - LISTEN_ADDR=:8080
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
